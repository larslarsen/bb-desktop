name: Social client

on:
  push:
    paths:
      - "social-main.js"
      - "social/**"
      - "wallet-contract/**"
      - "wallet-broker/**"
      - "wallet-pay/**"
      - "quote-worker/**"
      - "wallet-preload.js"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/security-policy.js"
      - "scripts/validate-sbom.js"
      - "scripts/validate-rust-sbom.js"
      - "scripts/build-deb.sh"
      - "scripts/build-macos.sh"
      - "scripts/build-windows.ps1"
      - ".github/workflows/social.yml"
  pull_request:
    paths:
      - "social-main.js"
      - "social/**"
      - "wallet-contract/**"
      - "wallet-broker/**"
      - "wallet-pay/**"
      - "quote-worker/**"
      - "wallet-preload.js"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/security-policy.js"
      - "scripts/validate-sbom.js"
      - "scripts/validate-rust-sbom.js"
      - "scripts/build-deb.sh"
      - "scripts/build-macos.sh"
      - "scripts/build-windows.ps1"
      - ".github/workflows/social.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: npm run build
      - run: npm run test:social
      - run: npm run test:security
      - run: npm run test:wallet
      - run: npm run test:wallet-broker
      - run: npm run test:wallet-pay
      - run: npm run test:rate
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.98.0 test --manifest-path wallet-broker/Cargo.toml --locked --no-default-features
      - run: cargo +1.98.0 fmt --manifest-path wallet-broker/Cargo.toml --check
      - run: cargo +1.98.0 clippy --manifest-path wallet-broker/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - run: cargo +1.98.0 check --manifest-path wallet-broker/Cargo.toml --locked --features native-ui --test native_surface

  package-linux:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=optional
      - run: npm run package:linux
      - name: Verify Chromium sandbox permissions
        run: dpkg-deb --contents dist/*.deb | grep --fixed-strings --regexp='-rwsr-xr-x root/root' | grep --fixed-strings './usr/lib/bitbook/chrome-sandbox'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bitbook-linux-deb
          path: dist/*.deb
          if-no-files-found: error

  package-windows:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=optional
      - run: npm run package:windows
      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/BitBook-windows-x64/BitBook.exe' -ArgumentList '--headless', '--disable-gpu' -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Packaged BitBook exited with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bitbook-windows-x64-unsigned
          path: dist/*windows-x64-unsigned.zip
          if-no-files-found: error

  package-macos:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            file_arch: arm64
          - runner: macos-15-intel
            arch: x64
            file_arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=optional
      - run: npm run package:macos
      - name: Verify architecture and signature
        run: |
          file dist/BitBook-macos-${{ matrix.arch }}/BitBook.app/Contents/MacOS/BitBook | grep '${{ matrix.file_arch }}'
          codesign --verify --deep --strict dist/BitBook-macos-${{ matrix.arch }}/BitBook.app
      - name: Smoke test packaged application
        run: |
          dist/BitBook-macos-${{ matrix.arch }}/BitBook.app/Contents/MacOS/BitBook --headless --disable-gpu &
          app_pid=$!
          sleep 5
          kill -0 "$app_pid"
          kill "$app_pid"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bitbook-macos-${{ matrix.arch }}-unsigned
          path: dist/*macos-${{ matrix.arch }}-unsigned.dmg
          if-no-files-found: error
