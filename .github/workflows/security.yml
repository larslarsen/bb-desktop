name: Maintained client security

on:
  pull_request:
    paths:
      - "social-main.js"
      - "social/**"
      - "test/**"
      - "scripts/security-policy.js"
      - "scripts/validate-sbom.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
      - ".gitleaksignore"
      - "js/utils/metrics.js"
      - "js/utils/feedback.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - run: npm audit --audit-level=low
      - run: node test/electronSecurity.node.js
      - run: node test/securityPolicy.node.js
      - run: node scripts/security-policy.js
      - name: Install pinned Gitleaks
        run: |
          archive="${RUNNER_TEMP}/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          test "$(stat --format=%s "${archive}")" -eq 8230402
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - run: gitleaks git --redact=100 --no-banner .
      - run: gitleaks dir --redact=100 --no-banner .
