name: Manual CycloneDX SBOM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - run: npm ci
      - run: npm audit --audit-level=low
      - name: Generate and validate CycloneDX JSON
        run: |
          set -euo pipefail
          sbom="${RUNNER_TEMP}/bitbook-desktop.cdx.json"
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-format JSON --output-file "${sbom}"
          node scripts/validate-sbom.js "${sbom}"
      - name: Upload CycloneDX document
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bitbook-desktop-cdx
          path: ${{ runner.temp }}/bitbook-desktop.cdx.json
          retention-days: 14
          if-no-files-found: error
