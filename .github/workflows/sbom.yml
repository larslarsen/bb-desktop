name: Manual CycloneDX SBOM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - run: npm ci
      - run: npm audit --audit-level=low
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Generate and validate npm CycloneDX JSON
        run: |
          set -euo pipefail
          sbom="${RUNNER_TEMP}/bitbook-desktop.cdx.json"
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-format JSON --output-file "${sbom}"
          node scripts/validate-sbom.js "${sbom}"
      - name: Generate and validate Rust CycloneDX JSON
        run: |
          set -euo pipefail
          cargo +1.98.0 cyclonedx --manifest-path wallet-broker/Cargo.toml --format json --all-features
          rust_sbom="${RUNNER_TEMP}/bitbook-wallet-broker.cdx.json"
          cp wallet-broker/bitbook-wallet-broker.cdx.json "${rust_sbom}"
          node scripts/validate-rust-sbom.js "${rust_sbom}"
      - name: Upload npm CycloneDX document
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bitbook-desktop-cdx
          path: ${{ runner.temp }}/bitbook-desktop.cdx.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload Rust CycloneDX document
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bitbook-wallet-broker-cdx
          path: ${{ runner.temp }}/bitbook-wallet-broker.cdx.json
          retention-days: 14
          if-no-files-found: error
